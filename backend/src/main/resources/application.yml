server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      timeout: 120m
      cookie:
        name: ${SESSION_COOKIE_NAME:ONEFLIGHTSESSION}
        path: ${SESSION_COOKIE_PATH:/api}
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}
spring:
  application:
    name: oneflight-api
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: Asia/Shanghai
      hibernate.type.preferred_instant_jdbc_type: TIMESTAMP
      hibernate.type.preferred_boolean_jdbc_type: BOOLEAN
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 101MB
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
oneflight:
  transport-mode: ${ONEFLIGHT_TRANSPORT_MODE:https}
  auth:
    mode: ${ONEFLIGHT_AUTH_MODE:local}
    local-maintenance-enabled: ${ONEFLIGHT_LOCAL_MAINTENANCE_ENABLED:false}
    four-a-origin: ${ONEFLIGHT_FOUR_A_ORIGIN:https://4a.jing-an.com:32712}
    parent-origin: ${ONEFLIGHT_PUBLIC_ORIGIN:}
    timeout-seconds: ${ONEFLIGHT_FOUR_A_TIMEOUT_SECONDS:8}
    bootstrap-four-a-user-id: ${ONEFLIGHT_BOOTSTRAP_FOUR_A_USER_ID:}
  allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173}
  upload-directory: ${UPLOAD_DIRECTORY:./data/uploads}
  bootstrap:
    username: ${BOOTSTRAP_ADMIN_USERNAME:admin}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}
    display-name: ${BOOTSTRAP_ADMIN_DISPLAY_NAME:平台管理员}
  sources:
    gateway-origin: ${SOURCE_GATEWAY_ORIGIN:https://dushu.jing-an.com:32716}
    gateway-system: ${SOURCE_GATEWAY_SYSTEM:jingqi}
    target-host: ${SOURCE_TARGET_HOST:47.96.225.165:32716}
    token: ${SOURCE_TOKEN:}
    username: ${SOURCE_USERNAME:}
    dushu-jdbc-url: ${SOURCE_DUSHU_JDBC_URL:}
    dushu-username: ${SOURCE_DUSHU_USERNAME:}
    dushu-password: ${SOURCE_DUSHU_PASSWORD:}
    icos-jdbc-url: ${SOURCE_ICOS_JDBC_URL:}
    icos-username: ${SOURCE_ICOS_USERNAME:}
    icos-password: ${SOURCE_ICOS_PASSWORD:}
    mqtt-url: ${SOURCE_MQTT_URL:}
    mqtt-username: ${SOURCE_MQTT_USERNAME:}
    mqtt-password: ${SOURCE_MQTT_PASSWORD:}
    algorithm-origin: ${SOURCE_ALGORITHM_ORIGIN:http://47.111.155.82:32052}
    timeout-seconds: ${SOURCE_TIMEOUT_SECONDS:8}
  map:
    style-url: ${MAP_STYLE_URL:https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json}
    satellite-url: ${MAP_SATELLITE_URL:}
    terrain-url: ${MAP_TERRAIN_URL:}
springdoc:
  api-docs:
    path: /v3/api-docs
