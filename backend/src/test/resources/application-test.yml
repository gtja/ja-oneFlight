spring:
  datasource:
    url: jdbc:h2:mem:oneflight-test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ''
oneflight:
  transport-mode: https
  auth:
    mode: local
    local-maintenance-enabled: false
    four-a-origin: https://identity.example.test
    parent-origin: https://platform.example.test
  upload-directory: ./target/test-uploads
  bootstrap:
    password: ''
  sources:
    # Ordinary tests never use private credentials inherited from the launcher environment.
    token: ''
    dushu-jdbc-url: ''
    icos-jdbc-url: ''
    mqtt-url: ''
