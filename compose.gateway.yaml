# Combined Java production: docker compose -f compose.production.yaml -f compose.gateway.yaml up -d
# Requires Docker Compose >= 2.24.4 for !reset. HTTPS gateway is the only public app entry.
services:
  app:
    ports: !reset []
    environment: &oneflight-sso
      ONEFLIGHT_AUTH_MODE: ${ONEFLIGHT_AUTH_MODE:-local}
      ONEFLIGHT_TRANSPORT_MODE: https
      ONEFLIGHT_BUNDLED_GATEWAY_ENABLED: 'false'
      ONEFLIGHT_LOCAL_MAINTENANCE_ENABLED: ${ONEFLIGHT_LOCAL_MAINTENANCE_ENABLED:-false}
      ONEFLIGHT_FOUR_A_ORIGIN: ${ONEFLIGHT_FOUR_A_ORIGIN:-https://4a.jing-an.com:32712}
      ONEFLIGHT_FOUR_A_TIMEOUT_SECONDS: ${ONEFLIGHT_FOUR_A_TIMEOUT_SECONDS:-8}
      ONEFLIGHT_BOOTSTRAP_FOUR_A_USER_ID: ${ONEFLIGHT_BOOTSTRAP_FOUR_A_USER_ID:-}
      ONEFLIGHT_PUBLIC_ORIGIN: ${ONEFLIGHT_PUBLIC_ORIGIN:?Configure parent HTTPS origin}
      FLIGHT_CONTROL_MODE: ${FLIGHT_CONTROL_MODE:-local}
      ONEFLIGHT_EMBED_VIEW: ${ONEFLIGHT_EMBED_VIEW:-native}
      FLIGHT_CONTROL_ENTRY_PATH: ${FLIGHT_CONTROL_ENTRY_PATH:-/source/UAV_AIRPORT}
      FLIGHT_CONTROL_DIRECT_URL: ${FLIGHT_CONTROL_DIRECT_URL:-https://dushu.jing-an.com:32716/control-room}
      FLIGHT_CONTROL_ORIGIN: ${FLIGHT_CONTROL_ORIGIN:?Configure distinct flight HTTPS origin}
      FLIGHT_CONTROL_GATEWAY_SECRET: ${FLIGHT_CONTROL_GATEWAY_SECRET:?Configure random gateway secret}
      SESSION_COOKIE_SECURE: 'true'
      ALLOWED_ORIGINS: ${ONEFLIGHT_PUBLIC_ORIGIN}
  gateway:
    image: oneflight-gateway:${APP_VERSION:-1.0.0}
    build:
      context: .
      dockerfile: deploy/gateway/Dockerfile
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - '${GATEWAY_HTTP_PORT:-80}:80'
      - '${GATEWAY_HTTPS_PORT:-443}:443'
    environment:
      ONEFLIGHT_TRANSPORT_MODE: https
      ONEFLIGHT_PUBLIC_ORIGIN: ${ONEFLIGHT_PUBLIC_ORIGIN:?Configure parent HTTPS origin}
      FLIGHT_CONTROL_ORIGIN: ${FLIGHT_CONTROL_ORIGIN:?Configure distinct flight HTTPS origin}
      FLIGHT_CONTROL_GATEWAY_SECRET: ${FLIGHT_CONTROL_GATEWAY_SECRET:?Configure random gateway secret}
      ONEFLIGHT_APP_UPSTREAM: app:8080
      ONEFLIGHT_API_UPSTREAM: app:8080
      DUSHU_UPSTREAM_HOST: ${DUSHU_UPSTREAM_HOST:-dushu.jing-an.com}
      DUSHU_UPSTREAM_PORT: ${DUSHU_UPSTREAM_PORT:-32716}
      DUSHU_TARGET_HOST: ${DUSHU_TARGET_HOST:-${SOURCE_TARGET_HOST:-47.96.225.165:32716}}
    volumes:
      - '${GATEWAY_TLS_DIRECTORY:-./private/gateway-tls}:/etc/oneflight/tls:ro'
    healthcheck:
      test: [CMD, nginx, -p, /tmp/oneflight-nginx/, -c, /tmp/oneflight-nginx/nginx.conf, -t]
      interval: 15s
      timeout: 5s
      retries: 3
